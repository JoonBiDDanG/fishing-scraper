name: 낚시 일정 스냅샷

# 기존 자동 스크래퍼 중지: 필요할 때만 수동 실행 가능
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fishing-snapshot
  cancel-in-progress: false

env:
  FULL_REFRESH: "1"

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 스냅샷 생성
        run: node scripts/crawl.mjs

      - name: 결과 검증
        run: node scripts/verify.mjs fishing_data.json

      - name: 변경분 커밋
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- fishing_data.json data/thefishing-ships.json)" ]; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fishing_data.json data/thefishing-ships.json
          git commit -m "chore: 일정 스냅샷 수동 업데이트"
          git push
