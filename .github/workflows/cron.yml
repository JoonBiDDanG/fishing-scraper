name: Update fishing data

on:
  schedule:
    # Refresh at minute 00 and 30 of each hour. A denied request stops safely.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "fishing_data.json"

permissions:
  contents: write

concurrency:
  group: fishing-data-collection
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect published schedules
        run: python scraper.py

      - name: Commit the latest snapshot
        run: |
          git add fishing_data.json
          if git diff --cached --quiet; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update cached fishing schedules"
          git pull --rebase origin main
          git push
