name: 낚시 일정 스냅샷

on:
  schedule:
    # 30분마다 공개 일정 갱신
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config.json"
      - ".github/workflows/cron.yml"

permissions:
  contents: write

concurrency:
  group: fishing-snapshot
  cancel-in-progress: false

env:
  FULL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 스냅샷 생성
        run: node scripts/crawl.mjs

      - name: 결과 검증
        run: node scripts/verify.mjs fishing_data.json

      - name: 변경분 커밋
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- fishing_data.json data/thefishing-ships.json)" ]; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fishing_data.json data/thefishing-ships.json
          git commit -m "chore: 일정 스냅샷 업데이트 ($(date -u +'%Y-%m-%dT%H:%MZ'))"
          git push

      - name: 요약
        if: always()
        run: |
          if [ -f fishing_data.json ]; then
            echo "### 스냅샷" >> "$GITHUB_STEP_SUMMARY"
            echo "- 크기: $(du -h fishing_data.json | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
            node -e '
              const d = require("./fishing_data.json");
              const counts = d.schedules.reduce((a, r) => ((a[r.source] = (a[r.source] || 0) + 1), a), {});
              console.log(`- 건수: ${d.total}` + Object.entries(counts).map(([k, v]) => ` (${k} ${v})`).join(""));
              console.log(`- 기간: ${d.minDate} ~ ${d.maxDate}`);
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
