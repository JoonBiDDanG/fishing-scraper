name: Update fishing data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check scraper availability
        id: scraper
        run: |
          if [ -f scraper.py ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::scraper.py is not in the repository yet; skipping data collection."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.scraper.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.scraper.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests beautifulsoup4
          fi

      - name: Collect data
        if: steps.scraper.outputs.available == 'true'
        run: python scraper.py

      - name: Commit updated data
        if: steps.scraper.outputs.available == 'true'
        run: |
          if [ -f fishing_data.json ]; then
            git add fishing_data.json
          else
            echo "fishing_data.json was not created; nothing to commit."
            exit 0
          fi

          if git diff --cached --quiet; then
            echo "Fishing data has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update fishing data"
